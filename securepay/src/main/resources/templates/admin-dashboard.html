<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>SecurePay | Admin Dashboard</title>

    ```
    <link rel="stylesheet" th:href="@{/css/admin.css}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    ```

</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="shell">

    ```
    <!-- ─── Sidebar ─── -->
    <aside>
        <div class="sidebar-brand">
            <div class="brand-dot"></div>
            <span class="brand-name">SecurePay</span>
        </div>

        <p class="sidebar-label">Navigation</p>
        <nav>
            <a id="nav-transactions" class="nav-item active" href="#" onclick="showTransactions()">
                <span class="nav-icon">⬡</span> Transactions
            </a>

            <a id="nav-users" class="nav-item" href="#" onclick="showUsers()">
                <span class="nav-icon">👤</span> Users
            </a>
        </nav>

        <div class="sidebar-footer">
            <a class="logout-btn" href="/login-page">
                <span>⎋</span> Logout
            </a>
        </div>
    </aside>

    <!-- ─── Main ─── -->
    <main>

        <div class="topbar">
            <div>
                <h1 class="page-title">All <em>Transactions</em></h1>
            </div>
            <div class="topbar-meta">
                <div>Role: <strong>Admin</strong></div>
                <div id="last-updated">Loading…</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Transactions</div>
                <div class="stat-value gold" id="stat-total">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Flagged</div>
                <div class="stat-value red" id="stat-flagged">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Clean</div>
                <div class="stat-value green" id="stat-clean">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Volume</div>
                <div class="stat-value" id="stat-volume">—</div>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Search by email or description…">
            </div>
            <select class="filter-select" id="filter-select">
                <option value="all">All transactions</option>
                <option value="flagged">Flagged only</option>
                <option value="clean">Clean only</option>
            </select>
            <button class="refresh-btn" id="refresh-btn" title="Refresh">↻</button>
        </div>

        <!-- Existing -->
        <div id="transaction-list"></div>

        <!-- ✅ ADDED USERS SECTION -->
        <div id="user-list" style="display:none;"></div>

    </main>
    ```

</div>

<div class="toast" id="toast"></div>

<script>
    const transactionList = document.getElementById('transaction-list');
    const searchInput     = document.getElementById('search-input');
    const filterSelect    = document.getElementById('filter-select');
    const refreshBtn      = document.getElementById('refresh-btn');
    let allTransactions   = [];

    /* ✅ VIEW SWITCH */
    function showTransactions() {
        transactionList.style.display = 'block';
        document.getElementById('user-list').style.display = 'none';

        // ✅ switch active state
        document.getElementById('nav-transactions').classList.add('active');
        document.getElementById('nav-users').classList.remove('active');
    }

    function showUsers() {
        transactionList.style.display = 'none';
        document.getElementById('user-list').style.display = 'block';
        renderUsers();

        // ✅ switch active state
        document.getElementById('nav-users').classList.add('active');
        document.getElementById('nav-transactions').classList.remove('active');
    }

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = (type === 'success' ? '✓ ' : '✕ ') + msg;
        t.className   = `toast ${type} show`;
        setTimeout(() => t.classList.remove('show'), 3200);
    }

    function updateStats(txs) {
        document.getElementById('stat-total').textContent   = txs.length;
        const flagged = txs.filter(t => t.flagged).length;
        document.getElementById('stat-flagged').textContent = flagged;
        document.getElementById('stat-clean').textContent   = txs.length - flagged;
        const vol = txs.reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
        document.getElementById('stat-volume').textContent  = '₹' + vol.toLocaleString('en-IN');
        document.getElementById('last-updated').textContent =
            'Updated ' + new Date().toLocaleTimeString();
    }

    function renderTransactions(txs) {
        transactionList.innerHTML = '';

        if (!txs || txs.length === 0) {
            transactionList.innerHTML = `<div class="empty-state"><div class="empty-icon">◈</div><p>No transactions found.</p></div>`;
            return;
        }

        txs.forEach((tx, i) => {
            const initials = (tx.userEmail || '?')[0].toUpperCase();
            const flaggedBadge = tx.flagged
                ? `<span class="badge badge-flagged">⚑ Flagged</span>`
                : `<span class="badge badge-clean">✓ Clean</span>`;

            const card = document.createElement('div');
            card.className = `tx-card${tx.flagged ? ' is-flagged' : ''}`;
            card.style.animationDelay = `${i * 0.05}s`;

            card.innerHTML = `
                <div class="tx-header">
                    <div class="tx-user">
                        <div class="tx-avatar">${initials}</div>
                        <div>
                            <div class="tx-email">${tx.userEmail ?? '—'}</div>
                            <div class="tx-date">${tx.date ?? '—'}</div>
                        </div>
                    </div>
                    <div class="tx-amount">₹${Number(tx.amount ?? 0).toLocaleString('en-IN')}</div>
                </div>

                <div class="tx-body">
                    <div class="tx-field">
                        <div class="tx-field-label">Description</div>
                        <div class="tx-field-value">${tx.description ?? '—'}</div>
                    </div>
                    <div class="tx-field">
                        <div class="tx-field-label">Status</div>
                        <div class="tx-field-value">${flaggedBadge}</div>
                    </div>
                    <div class="tx-field">
                        <div class="tx-field-label">Transaction ID</div>
                        <div class="tx-field-value" style="font-size:12px;color:var(--muted)">#${tx.id ?? '—'}</div>
                    </div>
                </div>

                <div class="tx-actions">
                    <input type="text" class="flag-input" placeholder="Flag reason…">
                    <button class="action-btn btn-flag flag-btn" data-id="${tx.id}">⚑ Flag</button>
                    <button class="action-btn btn-delete delete-btn" data-id="${tx.id}">✕ Delete</button>
                </div>
            `;

            transactionList.appendChild(card);
        });

        document.querySelectorAll('.flag-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const reason = this.previousElementSibling.value.trim();
                if (!reason) { showToast('Please enter a flag reason.', 'error'); return; }
                flagTransaction(this.dataset.id, reason);
            });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                if (confirm('Delete this transaction permanently?'))
                    deleteTransaction(this.dataset.id);
            });
        });
    }

    /* ✅ USERS RENDER */
    function renderUsers() {
        const userList = document.getElementById('user-list');
        userList.innerHTML = '';

        if (!allTransactions.length) {
            userList.innerHTML = `<p>No users found.</p>`;
            return;
        }

        const userMap = {};

        allTransactions.forEach(tx => {
            const email = tx.userEmail || 'Unknown';

            if (!userMap[email]) {
                userMap[email] = { count: 0, totalAmount: 0 };
            }

            userMap[email].count++;
            userMap[email].totalAmount += parseFloat(tx.amount) || 0;
        });

        Object.keys(userMap).forEach(email => {
            const user = userMap[email];

            const card = document.createElement('div');
            card.className = 'tx-card';

            card.innerHTML = `
                <div class="tx-header">
                    <div>
                        <div class="tx-email">${email}</div>
                        <div class="tx-date">User</div>
                    </div>
                    <div class="tx-amount">${user.count} Txns</div>
                </div>

                <div class="tx-body">
                    <div class="tx-field">
                        <div class="tx-field-label">Total Transactions</div>
                        <div class="tx-field-value">${user.count}</div>
                    </div>
                    <div class="tx-field">
                        <div class="tx-field-label">Total Amount</div>
                        <div class="tx-field-value">₹${user.totalAmount.toLocaleString('en-IN')}</div>
                    </div>
                </div>
            `;

            userList.appendChild(card);
        });
    }

    function applyFilters() {
        const q      = searchInput.value.toLowerCase();
        const filter = filterSelect.value;

        let filtered = allTransactions.filter(tx => {
            const matchQ = !q ||
                (tx.userEmail  ?? '').toLowerCase().includes(q) ||
                (tx.description ?? '').toLowerCase().includes(q);
            const matchF = filter === 'all' ||
                (filter === 'flagged' && tx.flagged) ||
                (filter === 'clean'   && !tx.flagged);
            return matchQ && matchF;
        });

        renderTransactions(filtered);
    }

    searchInput.addEventListener('input', applyFilters);
    filterSelect.addEventListener('change', applyFilters);

    function fetchTransactions() {
        fetch('/api/admin/transactions', {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include'
        })
            .then(res => res.json())
            .then(data => {
                allTransactions = data || [];
                updateStats(allTransactions);
                applyFilters();
            });
    }

    function flagTransaction(id, reason) {
        fetch('/api/admin/flag', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ transactionId: id, reason })
        }).then(() => fetchTransactions());
    }

    function deleteTransaction(id) {
        fetch('/api/admin/transaction/' + id, {
            method: 'DELETE',
            credentials: 'include'
        }).then(() => fetchTransactions());
    }

    refreshBtn.addEventListener('click', fetchTransactions);
    document.addEventListener('DOMContentLoaded', fetchTransactions);
</script>

</body>
</html>
